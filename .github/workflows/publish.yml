name: publish
on:
  schedule:
    - cron: '10 0 * * *'   # 每天 00:10 UTC —— 先于读者醒
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node build.mjs
      - name: Deploy to Vercel (static)
        run: npx vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
